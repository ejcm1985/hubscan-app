<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HubScan FTTH</title>
    <!-- Tailwind CSS para el diseño -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React y ReactDOM -->
    <script src="https://unpkg.com/react@17/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel para compilar JSX en el navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Librería para generar el PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        /* Estilos para el PDF (Ocultos en la vista de la app) */
        #pdf-template { display: none; }
        .pdf-mode #pdf-template { display: block; background: white; padding: 20px; color: black; }
        .pdf-mode #app-ui { display: none; }
        .pdf-page-break { page-break-before: always; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef } = React;

        function App() {
            const [hubName, setHubName] = useState('');
            const [racks, setRacks] = useState([]);
            const [isGeneratingPDF, setIsGeneratingPDF] = useState(false);

            // Manejo de carga de imágenes
            const handleImageUpload = (event, callback) => {
                const file = event.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => callback(reader.result);
                    reader.readAsDataURL(file);
                }
            };

            const addRack = () => {
                const newRack = {
                    id: Date.now(),
                    name: `Rack ${racks.length + 1}`,
                    photo: null,
                    equipments: []
                };
                setRacks([...racks, newRack]);
            };

            const updateRackPhoto = (rackId, photoStr) => {
                setRacks(racks.map(r => r.id === rackId ? { ...r, photo: photoStr } : r));
            };

            const addEquipment = (rackId) => {
                const newEq = {
                    id: Date.now(),
                    name: '',
                    type: 'ODF',
                    photo: null
                };
                setRacks(racks.map(r => {
                    if (r.id === rackId) {
                        return { ...r, equipments: [...r.equipments, newEq] };
                    }
                    return r;
                }));
            };

            const updateEquipment = (rackId, eqId, field, value) => {
                setRacks(racks.map(r => {
                    if (r.id === rackId) {
                        return {
                            ...r,
                            equipments: r.equipments.map(eq => eq.id === eqId ? { ...eq, [field]: value } : eq)
                        };
                    }
                    return r;
                }));
            };

            // Función principal para generar el PDF
            const generatePDF = () => {
                if (!hubName) {
                    alert("Por favor ingresa el nombre del Hub antes de exportar.");
                    return;
                }
                
                setIsGeneratingPDF(true);
                
                // Mostrar temporalmente el template del PDF y ocultar la UI
                document.body.classList.add('pdf-mode');
                const element = document.getElementById('pdf-template');
                
                const opt = {
                    margin:       10,
                    filename:     `Levantamiento_${hubName.replace(/\s+/g, '_')}.pdf`,
                    image:        { type: 'jpeg', quality: 0.98 },
                    html2canvas:  { scale: 2, useCORS: true },
                    jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
                };

                html2pdf().set(opt).from(element).save().then(() => {
                    // Restaurar la UI normal
                    document.body.classList.remove('pdf-mode');
                    setIsGeneratingPDF(false);
                });
            };

            return (
                <div>
                    {/* UI DE LA APLICACIÓN MÓVIL */}
                    <div id="app-ui" class="max-w-md mx-auto bg-white min-h-screen shadow-lg pb-20">
                        <header class="bg-blue-800 text-white p-4 sticky top-0 z-10 flex justify-between items-center">
                            <h1 class="text-xl font-bold">HubScan FTTH</h1>
                            <button onClick={generatePDF} class="bg-red-600 hover:bg-red-700 px-3 py-1 rounded text-sm font-bold shadow">
                                {isGeneratingPDF ? 'Creando...' : '📄 PDF'}
                            </button>
                        </header>

                        <div class="p-4">
                            <div class="mb-6">
                                <label class="block text-sm font-bold text-gray-700 mb-1">Nombre del Hub / Sitio</label>
                                <input 
                                    type="text" 
                                    value={hubName}
                                    onChange={(e) => setHubName(e.target.value)}
                                    placeholder="Ej: Hub San Juan" 
                                    class="w-full border-2 border-gray-300 rounded p-2 focus:border-blue-500 outline-none uppercase"
                                />
                            </div>

                            {racks.map((rack, rIndex) => (
                                <div key={rack.id} class="bg-gray-50 border border-gray-200 rounded-lg p-3 mb-6 shadow-sm">
                                    <h2 class="text-lg font-bold text-blue-900 border-b pb-2 mb-3">Rack {rIndex + 1}</h2>
                                    
                                    <div class="mb-4">
                                        <label class="block text-sm font-bold mb-1">Foto Frontal del Rack</label>
                                        {rack.photo ? (
                                            <img src={rack.photo} class="w-full h-48 object-cover rounded mb-2 border" />
                                        ) : (
                                            <div class="border-2 border-dashed border-gray-400 bg-gray-100 h-32 rounded flex items-center justify-center mb-2">
                                                <span class="text-gray-500 text-sm">Sin imagen</span>
                                            </div>
                                        )}
                                        <input 
                                            type="file" 
                                            accept="image/*" capture="environment"
                                            onChange={(e) => handleImageUpload(e, (img) => updateRackPhoto(rack.id, img))}
                                            class="text-sm w-full"
                                        />
                                    </div>

                                    <div class="mt-4">
                                        <h3 class="font-bold text-sm bg-gray-200 p-1 rounded">Equipos (Desde Arriba hacia Abajo)</h3>
                                        {rack.equipments.map((eq, eqIndex) => (
                                            <div key={eq.id} class="bg-white border p-2 mt-2 rounded flex flex-col gap-2 shadow-sm">
                                                <div class="flex gap-2">
                                                    <span class="bg-blue-800 text-white font-bold px-2 rounded text-sm flex items-center">
                                                        RU {eqIndex + 1}
                                                    </span>
                                                    <select 
                                                        value={eq.type}
                                                        onChange={(e) => updateEquipment(rack.id, eq.id, 'type', e.target.value)}
                                                        class="border rounded p-1 text-sm bg-gray-50"
                                                    >
                                                        <option>ODF</option>
                                                        <option>OLT</option>
                                                        <option>EDFA</option>
                                                        <option>Splitter</option>
                                                        <option>Switch</option>
                                                        <option>Energía</option>
                                                    </select>
                                                </div>
                                                <input 
                                                    type="text" 
                                                    placeholder="Descripción / Puertos (Ej: ODF #1 124 Hilos)" 
                                                    value={eq.name}
                                                    onChange={(e) => updateEquipment(rack.id, eq.id, 'name', e.target.value)}
                                                    class="w-full border rounded p-1 text-sm outline-none"
                                                />
                                                <div class="flex items-center gap-2 mt-1">
                                                    <input 
                                                        type="file" 
                                                        accept="image/*" capture="environment"
                                                        onChange={(e) => handleImageUpload(e, (img) => updateEquipment(rack.id, eq.id, 'photo', img))}
                                                        class="text-xs w-[180px]"
                                                    />
                                                    {eq.photo && <span class="text-green-600 text-xs font-bold">✓ Foto OK</span>}
                                                </div>
                                            </div>
                                        ))}
                                        <button 
                                            onClick={() => addEquipment(rack.id)}
                                            class="w-full mt-3 bg-blue-100 text-blue-800 border border-blue-300 font-bold py-2 rounded text-sm hover:bg-blue-200"
                                        >
                                            + Agregar Equipo
                                        </button>
                                    </div>
                                </div>
                            ))}

                            <button 
                                onClick={addRack}
                                class="w-full bg-blue-800 text-white font-bold py-3 rounded-lg shadow-md hover:bg-blue-900 mb-4"
                            >
                                + AÑADIR RACK
                            </button>
                        </div>
                    </div>

                    {/* PLANTILLA INVISIBLE PARA EL PDF */}
                    <div id="pdf-template" class="font-sans">
                        <div class="text-center mb-6 border-b-4 border-blue-900 pb-2">
                            <h1 class="text-2xl font-bold text-blue-900 uppercase">Reporte Técnico de Hub FTTH</h1>
                            <h2 class="text-lg font-bold text-gray-700">Sitio: {hubName || 'No especificado'}</h2>
                            <p class="text-sm text-gray-500">Fecha: {new Date().toLocaleDateString()}</p>
                        </div>

                        {racks.length === 0 ? <p>No hay racks registrados en este levantamiento.</p> : null}

                        {racks.map((rack, rIndex) => (
                            <div key={rack.id} class="mb-8">
                                <h3 class="text-xl font-bold bg-blue-900 text-white p-2 rounded mb-4">RACK {rIndex + 1}</h3>
                                
                                <div class="mb-4">
                                    <p class="font-bold border-b mb-2">Fotografía General Frontal</p>
                                    {rack.photo ? (
                                        <img src={rack.photo} style={{ maxHeight: '300px', objectFit: 'contain' }} class="mx-auto border p-1" />
                                    ) : (
                                        <p class="text-gray-500 italic">No se adjuntó fotografía frontal.</p>
                                    )}
                                </div>

                                <p class="font-bold border-b mt-6 mb-2">Inventario Descendente (Tope a Base)</p>
                                <table class="w-full border-collapse mb-4 text-sm">
                                    <thead>
                                        <tr class="bg-gray-200">
                                            <th class="border p-2 text-left w-16">Pos</th>
                                            <th class="border p-2 text-left w-24">Equipo</th>
                                            <th class="border p-2 text-left">Descripción / Detalles</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {rack.equipments.map((eq, eqIndex) => (
                                            <tr key={eq.id}>
                                                <td class="border p-2 font-bold text-center">RU {eqIndex + 1}</td>
                                                <td class="border p-2 font-bold">{eq.type}</td>
                                                <td class="border p-2 uppercase">{eq.name || '-'}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>

                                {/* Renderizar las fotos de detalle de los equipos */}
                                <div class="grid grid-cols-2 gap-4 mt-4">
                                    {rack.equipments.filter(e => e.photo).map((eq, eqIndex) => (
                                        <div key={eq.id} class="border rounded p-2 text-center">
                                            <p class="text-xs font-bold mb-1 bg-gray-100">RU {eqIndex + 1} - {eq.type}</p>
                                            <img src={eq.photo} style={{ maxHeight: '150px', objectFit: 'cover' }} class="mx-auto" />
                                        </div>
                                    ))}
                                </div>
                                <div class="pdf-page-break"></div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
