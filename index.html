<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HubScan FTTH - Supabase</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@17/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Cliente oficial de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- html2pdf para mantener la opción de respaldo local -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        #pdf-template { display: none; }
        .pdf-mode #pdf-template { display: block; background: white; padding: 20px; color: black; }
        .pdf-mode #app-ui { display: none; }
        .pdf-page-break { page-break-before: always; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans">
    <div id="root"></div>

    <script type="text/babel">
        // ==========================================
        // CONFIGURACIÓN DE SUPABASE
        // ==========================================
        const SUPABASE_URL = 'https://auagjyrexqmcztdfoihw.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF1YWdqeXJleHFtY3p0ZGZvaWh3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0MzM3NjcsImV4cCI6MjEwODAwOTc2N30.19XMDtqun8xBjQegbi9TUjczUyixHLUeErR8m_yX0UY';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const { useState } = React;

        function App() {
            const [hubName, setHubName] = useState('');
            const [racks, setRacks] = useState([]);
            const [isSyncing, setIsSyncing] = useState(false);
            const [isGeneratingPDF, setIsGeneratingPDF] = useState(false);

            // Ahora guardamos el archivo real (File) para Supabase y un preview para la UI
            const handleImageUpload = (event, callback) => {
                const file = event.target.files[0];
                if (file) {
                    const previewUrl = URL.createObjectURL(file);
                    callback({ file: file, preview: previewUrl });
                }
            };

            const addRack = () => {
                setRacks([...racks, { id: Date.now(), name: `Rack ${racks.length + 1}`, photoData: null, equipments: [] }]);
            };

            const updateRackPhoto = (rackId, photoObj) => {
                setRacks(racks.map(r => r.id === rackId ? { ...r, photoData: photoObj } : r));
            };

            const addEquipment = (rackId) => {
                setRacks(racks.map(r => r.id === rackId ? { ...r, equipments: [...r.equipments, { id: Date.now(), name: '', type: 'ODF', photoData: null }] } : r));
            };

            const updateEquipment = (rackId, eqId, field, value) => {
                setRacks(racks.map(r => r.id === rackId ? { ...r, equipments: r.equipments.map(eq => eq.id === eqId ? { ...eq, [field]: value } : eq) } : r));
            };

            // Función para subir foto a Supabase y retornar URL pública
            const uploadPhotoToSupabase = async (file, pathName) => {
                const fileName = `${Date.now()}_${pathName}.jpg`;
                const { data, error } = await supabase.storage.from('fotos').upload(fileName, file, { cacheControl: '3600', upsert: false });
                if (error) throw error;
                const { data: publicUrlData } = supabase.storage.from('fotos').getPublicUrl(fileName);
                return publicUrlData.publicUrl;
            };

            const syncToSupabase = async () => {
                if (!hubName) {
                    alert("Ingresa el nombre del Hub.");
                    return;
                }
                
                setIsSyncing(true);

                try {
                    let racksPayload = JSON.parse(JSON.stringify(racks)); // Copia profunda

                    // 1. Subir las imágenes de los Racks y Equipos al Bucket
                    for (let i = 0; i < racks.length; i++) {
                        let rack = racks[i];
                        let payloadRack = racksPayload[i];

                        if (rack.photoData?.file) {
                            payloadRack.photoUrl = await uploadPhotoToSupabase(rack.photoData.file, `rack_${rack.id}`);
                        }
                        
                        for (let j = 0; j < rack.equipments.length; j++) {
                            let eq = rack.equipments[j];
                            if (eq.photoData?.file) {
                                racksPayload[i].equipments[j].photoUrl = await uploadPhotoToSupabase(eq.photoData.file, `eq_${eq.id}`);
                            }
                        }
                        // Limpiamos los objetos binarios del payload antes de guardarlos en BD
                        delete payloadRack.photoData;
                        payloadRack.equipments.forEach(e => delete e.photoData);
                    }

                    // 2. Guardar el JSON estructurado en la base de datos
                    const { data, error } = await supabase
                        .from('levantamientos')
                        .insert([{ hub_name: hubName, datos_racks: racksPayload }]);

                    if (error) throw error;

                    alert("¡Sincronización exitosa con Supabase!");
                } catch (error) {
                    console.error("Error en sincronización:", error);
                    alert("Error al subir los datos: " + error.message);
                } finally {
                    setIsSyncing(false);
                }
            };

            // PDF de Respaldo Local (Mantiene la funcionalidad offline)
            const generatePDF = () => {
                if (!hubName) return alert("Ingresa el nombre del Hub.");
                setIsGeneratingPDF(true);
                document.body.classList.add('pdf-mode');
                const element = document.getElementById('pdf-template');
                html2pdf().set({ margin: 10, filename: `${hubName}.pdf`, image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2 }, jsPDF: { format: 'a4', orientation: 'portrait' } })
                .from(element).save().then(() => {
                    document.body.classList.remove('pdf-mode');
                    setIsGeneratingPDF(false);
                });
            };

            return (
                <div>
                    <div id="app-ui" class="max-w-md mx-auto bg-white min-h-screen shadow-lg pb-20">
                        <header class="bg-blue-900 text-white p-4 sticky top-0 z-10 flex flex-col gap-2 shadow-md">
                            <h1 class="text-xl font-bold text-center tracking-wide">HubScan FTTH</h1>
                            <div class="flex justify-between gap-2">
                                <button onClick={generatePDF} class="bg-gray-600 hover:bg-gray-700 px-2 py-2 rounded text-sm font-bold shadow w-1/2">
                                    {isGeneratingPDF ? 'Creando...' : '📄 Backup PDF'}
                                </button>
                                <button onClick={syncToSupabase} class="bg-emerald-500 hover:bg-emerald-600 px-2 py-2 rounded text-sm font-bold shadow w-1/2 text-white">
                                    {isSyncing ? 'Sincronizando...' : '☁️ Subir a Nube'}
                                </button>
                            </div>
                        </header>

                        <div class="p-4">
                            <div class="mb-6">
                                <label class="block text-sm font-bold text-gray-700 mb-1">Nombre del Hub / Sitio</label>
                                <input type="text" value={hubName} onChange={(e) => setHubName(e.target.value)} placeholder="Ej: Hub San Juan" class="w-full border-2 border-gray-300 rounded p-2 outline-none uppercase font-bold" />
                            </div>

                            {racks.map((rack, rIndex) => (
                                <div key={rack.id} class="bg-gray-50 border rounded-lg p-3 mb-6 shadow-sm">
                                    <h2 class="text-lg font-bold text-blue-900 border-b pb-2 mb-3">Rack {rIndex + 1}</h2>
                                    
                                    <div class="mb-4">
                                        <label class="block text-sm font-bold mb-1">Foto Frontal del Rack</label>
                                        {rack.photoData?.preview ? (
                                            <img src={rack.photoData.preview} class="w-full h-48 object-cover rounded mb-2 border" />
                                        ) : (
                                            <div class="border-2 border-dashed border-gray-400 bg-gray-100 h-24 rounded flex items-center justify-center mb-2">
                                                <span class="text-gray-500 text-sm">📷 Agregar Foto Frontal</span>
                                            </div>
                                        )}
                                        <input type="file" accept="image/*" capture="environment" onChange={(e) => handleImageUpload(e, (obj) => updateRackPhoto(rack.id, obj))} class="text-sm w-full"/>
                                    </div>

                                    <div class="mt-4">
                                        <h3 class="font-bold text-sm bg-gray-200 p-1 rounded mb-2">Equipos (Tope a Base)</h3>
                                        {rack.equipments.map((eq, eqIndex) => (
                                            <div key={eq.id} class="bg-white border p-2 mt-2 rounded flex flex-col gap-2 shadow-sm border-l-4 border-l-blue-800">
                                                <div class="flex gap-2">
                                                    <span class="bg-blue-800 text-white font-bold px-2 rounded text-sm flex items-center">RU {eqIndex + 1}</span>
                                                    <select value={eq.type} onChange={(e) => updateEquipment(rack.id, eq.id, 'type', e.target.value)} class="border rounded p-1 text-sm bg-gray-50 font-bold flex-1">
                                                        <option>ODF</option><option>OLT</option><option>EDFA</option>
                                                        <option>Chasis Splitter</option><option>Switch</option><option>Rectificador DC</option>
                                                    </select>
                                                </div>
                                                <input type="text" placeholder="Descripción (Ej: ODF #1 124 Hilos)" value={eq.name} onChange={(e) => updateEquipment(rack.id, eq.id, 'name', e.target.value)} class="w-full border rounded p-1 text-sm outline-none"/>
                                                <div class="flex items-center gap-2 mt-1">
                                                    <input type="file" accept="image/*" capture="environment" onChange={(e) => handleImageUpload(e, (obj) => updateEquipment(rack.id, eq.id, 'photoData', obj))} class="text-xs w-full"/>
                                                    {eq.photoData?.preview && <span class="text-emerald-600 text-xs font-bold whitespace-nowrap">✓ Foto Lista</span>}
                                                </div>
                                            </div>
                                        ))}
                                        <button onClick={() => addEquipment(rack.id)} class="w-full mt-3 bg-blue-100 text-blue-900 border border-blue-300 font-bold py-2 rounded text-sm hover:bg-blue-200">
                                            + Agregar Equipo
                                        </button>
                                    </div>
                                </div>
                            ))}
                            <button onClick={addRack} class="w-full bg-blue-900 text-white font-bold py-3 rounded-lg shadow-md hover:bg-blue-950 mb-4">
                                + AÑADIR NUEVO RACK
                            </button>
                        </div>
                    </div>

                    {/* Plantilla PDF */}
                    <div id="pdf-template" class="font-sans">
                        <div class="text-center mb-6 border-b-4 border-blue-900 pb-2">
                            <h1 class="text-2xl font-bold text-blue-900 uppercase">Levantamiento Técnico Hub FTTH</h1>
                            <h2 class="text-lg font-bold">Sitio: {hubName}</h2>
                        </div>
                        {racks.map((rack, rIndex) => (
                            <div key={rack.id} class="mb-8">
                                <h3 class="text-xl font-bold bg-blue-900 text-white p-2 rounded mb-4">RACK {rIndex + 1}</h3>
                                {rack.photoData?.preview && <img src={rack.photoData.preview} style={{ maxHeight: '300px', objectFit: 'contain' }} class="mx-auto border mb-4" />}
                                <table class="w-full border-collapse mb-4 text-sm">
                                    <thead><tr class="bg-gray-200"><th class="border p-2 w-16">Pos</th><th class="border p-2 w-24">Equipo</th><th class="border p-2">Descripción</th></tr></thead>
                                    <tbody>
                                        {rack.equipments.map((eq, eqIndex) => (
                                            <tr key={eq.id}>
                                                <td class="border p-2 text-center font-bold">RU {eqIndex + 1}</td>
                                                <td class="border p-2 font-bold">{eq.type}</td><td class="border p-2 uppercase">{eq.name || '-'}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                                <div class="grid grid-cols-2 gap-4 mt-4">
                                    {rack.equipments.filter(e => e.photoData?.preview).map((eq, eqIndex) => (
                                        <div key={eq.id} class="border rounded p-2 text-center">
                                            <p class="text-xs font-bold mb-1 bg-gray-100">RU {eqIndex + 1} - {eq.type}</p>
                                            <img src={eq.photoData.preview} style={{ maxHeight: '150px', objectFit: 'cover' }} class="mx-auto" />
                                        </div>
                                    ))}
                                </div>
                                <div class="pdf-page-break"></div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
